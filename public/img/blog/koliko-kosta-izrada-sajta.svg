<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Koliko kosta izrada sajta, prozor pregledaca sa cenovnom etiketom">
<defs>
  <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a1412"/><stop offset="1" stop-color="#14100E"/>
  </linearGradient>
  <radialGradient id="glow9" cx="0.5" cy="0.42" r="0.62">
    <stop offset="0" stop-color="#8C2438" stop-opacity="0.30"/>
    <stop offset="0.55" stop-color="#8C2438" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#8C2438" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid9" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#F2EAE2" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg9)"/>
<rect width="1200" height="630" fill="url(#grid9)"/>
<rect width="1200" height="630" fill="url(#glow9)"/>

